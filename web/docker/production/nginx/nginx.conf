server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  # No caching of app-shell / manifest / service worker: upgrades can be discovered immediately.
  location = /sw.js { expires -1; try_files $uri =404; }
  location = /site.webmanifest {
    types { application/manifest+json webmanifest; }
    expires -1;
    try_files $uri =404;
  }
  location = /index.html { expires -1; try_files $uri =404; }
  location /api/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS on;
    fastcgi_pass api:9000;
    fastcgi_read_timeout 45s;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
  location ~ /\.(?!well-known) { deny all; }
}
